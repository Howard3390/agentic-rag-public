[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.2,<2", "mcp==2.3.0", "openai>=2,<3", "python-dotenv>=1,<2", "streamlit>=1.45,<2"]

[project.scripts]
agentic-rag = "agentic_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
